name: One-time mobile RWD fix
on:
  push:
    paths:
      - '.github/workflows/fix-mobile-rwd.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch mobile responsive CSS
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('*{box-sizing:border-box}\n    html{scroll-behavior:smooth}', '*{box-sizing:border-box}\n    html{scroll-behavior:smooth;max-width:100%;overflow-x:hidden}')
          s = s.replace('      margin:0;\n      background:var(--paper);', '      margin:0;\n      max-width:100%;\n      overflow-x:hidden;\n      background:var(--paper);', 1)
          s = s.replace('    button,input,a{font:inherit}', '    img,svg,canvas{max-width:100%}\n    button,input,a{font:inherit}', 1)
          s = s.replace('.shell{width:min(1180px,100%);margin:auto;padding:clamp(16px,3vw,34px)}', '.shell{width:100%;max-width:1180px;min-width:0;margin:auto;padding:clamp(16px,3vw,34px)}')
          s = s.replace('grid-template-columns:minmax(0,1.45fr) minmax(250px,.55fr);', 'grid-template-columns:minmax(0,1.45fr) minmax(220px,.55fr);')
          s = s.replace('      align-items:end;\n      padding:18px 0 24px;', '      align-items:end;\n      min-width:0;\n      padding:18px 0 24px;', 1)
          s = s.replace('    .eyebrow{font-size:', '    .hero>*{min-width:0}\n    .eyebrow{font-size:', 1)
          s = s.replace('.hero-card{background:', '.hero-card{width:100%;max-width:100%;min-width:0;overflow:hidden;background:', 1)
          s = s.replace('.hero-card span{font-size:.82rem;color:var(--muted)}', '.hero-card span{display:block;max-width:100%;font-size:.82rem;color:var(--muted);overflow-wrap:anywhere}')
          s = s.replace('.route-strip{display:flex;gap:8px;overflow:auto;padding:16px 0 0;', '.route-strip{display:flex;gap:8px;width:100%;max-width:100%;min-width:0;overflow-x:auto;overflow-y:hidden;padding:16px 0 2px;')
          old = '''    @media (max-width:760px){
      .hero{grid-template-columns:1fr}.city-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hotel-grid{grid-template-columns:1fr}.map-meta{width:100%;margin-left:0}.day-main{grid-template-columns:56px minmax(0,1fr) 22px}.day-map{width:40px;height:40px;padding:6px;justify-content:center;margin-right:10px}.day-map .map-label{display:none}.day-body{padding:0 12px 12px}.section-head{align-items:start;flex-direction:column}.section-head p{text-align:left}
    }
    @media (max-width:390px){
      .shell{padding:12px}.city-grid{grid-template-columns:1fr 1fr}.city-card{padding:0}.city-card .city-copy{padding:11px 12px 13px}.tools{grid-template-columns:1fr}.expand-all{width:100%}.timeline li{grid-template-columns:57px minmax(0,1fr)}#tripMap{height:390px}
    }'''
          new = '''    @media (max-width:760px){
      .shell{padding:18px 16px 28px}
      .hero{display:block;padding:10px 0 22px}
      .hero-card{margin-top:18px;padding:16px 18px;border-radius:18px}
      .hero-card b{font-size:clamp(1.9rem,9vw,2.4rem);white-space:nowrap}
      .route-strip{padding-top:14px}
      .city-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
      .hotel-grid{grid-template-columns:1fr}
      .map-meta{width:100%;margin-left:0}
      #tripMap{height:420px}
      .day-main{grid-template-columns:56px minmax(0,1fr) 22px}
      .day-map{width:40px;height:40px;padding:6px;justify-content:center;margin-right:10px}
      .day-map .map-label{display:none}
      .day-body{padding:0 12px 12px}
      .section-head{align-items:start;flex-direction:column}
      .section-head p{text-align:left}
    }
    @media (max-width:480px){
      .shell{padding:12px 12px 24px}
      .eyebrow{font-size:.7rem;letter-spacing:.16em}
      h1{font-size:clamp(2.25rem,12vw,3rem);margin:.45rem 0 .55rem}
      .hero{padding-top:8px}
      .hero-card{margin-top:16px;padding:15px 16px;border-radius:18px}
      .hero-card b{font-size:clamp(1.9rem,10vw,2.2rem)}
      .hero-card span{font-size:.78rem}
      .route-strip{gap:7px;font-size:.78rem;padding-top:12px}
      .section{margin-top:22px}
      .section-head{gap:3px;margin-bottom:10px}
      .section-head h2{font-size:.98rem}
      .section-head p{font-size:.73rem}
      .map-panel{border-radius:18px}
      .map-toolbar{padding:10px;gap:7px}
      .map-chip{min-height:40px;padding:7px 11px}
      .legend{gap:6px 10px}
      #tripMap{height:380px}
      .map-note{padding:9px 11px;font-size:.68rem}
      .city-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
      .city-card{padding:0;border-radius:18px}
      .city-card .city-copy{padding:10px 11px 12px}
      .city-card b{font-size:.96rem}
      .city-card small{font-size:.7rem}
      .tools{grid-template-columns:1fr;padding:8px 0}
      .search,.expand-all{min-height:46px}
      .expand-all{width:100%}
      .day-main{grid-template-columns:50px minmax(0,1fr) 18px;gap:7px;padding:11px 8px 11px 10px}
      .day-map{width:38px;height:38px;margin-right:8px}
      .timeline li{grid-template-columns:55px minmax(0,1fr);gap:7px}
      .hotel{grid-template-columns:1fr;gap:8px;padding:12px}
      .hotel a{justify-self:start}
    }
    @media (max-width:340px){
      .shell{padding-left:10px;padding-right:10px}
      .city-grid{gap:7px}
      .city-card .city-copy{padding:9px 9px 11px}
      .map-chip{padding-left:10px;padding-right:10px}
      .day-main{grid-template-columns:47px minmax(0,1fr) 16px;padding-left:8px}
    }'''
          if old not in s:
              raise SystemExit('Expected responsive CSS block not found')
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/fix-mobile-rwd.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-mobile-rwd.yml
          git commit -m "Fix mobile RWD and hero overflow"
          git push
