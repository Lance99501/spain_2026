name: One-time mobile RWD fix
on:
  push:
    paths:
      - '.github/workflows/fix-mobile-rwd.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch mobile responsive CSS
        run: python fix_mobile_rwd.py
      - name: Commit responsive fix
        run: |
          rm fix_mobile_rwd.py
          rm .github/workflows/fix-mobile-rwd.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html fix_mobile_rwd.py .github/workflows/fix-mobile-rwd.yml
          git commit -m "Fix mobile RWD and hero overflow"
          git push
