name: One-time approved itinerary sync
on:
  push:
    paths:
      - '.github/workflows/sync-approved-itinerary.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync approved itinerary changes
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          replacements = {
            "{date:'10/16',dow:'Fri',city:'Sevilla',title:'Córdoba 一日遊',sub:'以 Mezquita-Catedral 為核心',cats:['pending','flex'],map:googleDirections('Mezquita-Catedral de Córdoba','Puente Romano de Córdoba',[],'walking'),items:[['上午','Sevilla ↔ Córdoba','火車待確認'],['約10:00','Mezquita-Catedral de Córdoba',''],['之後','Judería · 午餐 · Puente Romano 河岸','']],tags:['火車待確認','不塞第二宮殿']},":
            "{date:'10/16',dow:'Fri',city:'Sevilla',title:'Córdoba 一日遊',sub:'以 Mezquita-Catedral 為核心',cats:['confirmed','pending','flex'],map:googleDirections('Mezquita-Catedral de Córdoba','Puente Romano de Córdoba',[],'walking'),items:[['08:11','Sevilla-Santa Justa → Córdoba','iryo 06097 Inicial · 08:52 抵達 · 已確認'],['約10:00','Mezquita-Catedral de Córdoba','待購票'],['之後','Judería · 午餐 · Puente Romano 河岸',''],['傍晚','Córdoba → Sevilla','回程交通待確認']],tags:['去程 iryo 已確認','回程交通待確認','Mezquita 待購票']},",

            "{date:'10/18',dow:'Sun',city:'Granada',title:'Sevilla → Granada',sub:'抵達山城，夕陽只是加分',cats:['pending','flex','rest'],map:googleSearch('Hotel Navas Granada'),items:[['上午','Sevilla 市中心自由散步＋退房',''],['移動','Sevilla → Granada','交通目前待確認'],['14:00+','Hotel Navas 入住',''],['午後','Centro → Carrera del Darro',''],['17:30','Albaicín + Mirador de San Nicolás','視抵達時間與體力決定']],tags:['城際交通待確認','夕陽彈性','累就取消']},":
            "{date:'10/18',dow:'Sun',city:'Granada',title:'Sevilla → Granada',sub:'ALSA 直達已確認 · 抵達山城後放慢',cats:['confirmed','flex','rest'],map:googleDirections('Estación de Autobuses Plaza de Armas, Sevilla','Estación de Autobuses de Granada',[],'transit'),items:[['上午','Sevilla 市中心自由散步＋退房',''],['11:45','Sevilla Plaza de Armas → Granada Bus Station','ALSA 直達 · 14:45 抵達 · 已確認'],['14:00+','Hotel Navas 入住','抵達後前往市中心'],['午後','Centro → Carrera del Darro',''],['17:30','Albaicín + Mirador de San Nicolás','視抵達時間與體力決定']],tags:['ALSA 已確認','夕陽彈性','累就取消']},",

            "資料基準：Notion 最新旅伴行程＋已確認 Reservation，更新基準 2026/08/24。10/20 Granada → Madrid 已採最新 ALVIA 2087 Confort 11:04–14:38 已購票狀態；訂單號、付款與票券私人資訊未放入本頁。":
            "資料基準：Notion 最新旅伴行程＋已確認 Reservation，更新基準 2026/08/27。10/16 Sevilla → Córdoba 去程 iryo 06097、10/18 Sevilla → Granada ALSA，以及 10/20 Granada → Madrid ALVIA 2087 均採最新已確認狀態；訂單號、付款與票券私人資訊未放入本頁。"
          }

          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Expected content not found: {old[:100]}')
              s = s.replace(old, new, 1)

          cordoba_anchor = "      {city:'Cordoba',name:'Puente Romano de Córdoba',type:'attraction',status:'flex',lat:37.87660,lng:-4.77890,address:'Córdoba',dates:'10/16'},"
          cordoba_new = cordoba_anchor + "\n      {city:'Cordoba',name:'Córdoba Central',type:'transport',status:'transport',lat:37.88855,lng:-4.78905,address:'Glorieta de las Tres Culturas, Córdoba',dates:'10/16 08:52'},"
          if cordoba_anchor not in s:
              raise SystemExit('Córdoba map anchor not found')
          s = s.replace(cordoba_anchor, cordoba_new, 1)

          sevilla_anchor = "      {city:'Sevilla',name:'Sevilla-Santa Justa',type:'transport',status:'transport',lat:37.39230,lng:-5.97500,address:'Sevilla',dates:'10/14 14:47'},"
          sevilla_new = sevilla_anchor + "\n      {city:'Sevilla',name:'Sevilla Plaza de Armas Bus Station',type:'transport',status:'transport',lat:37.39172,lng:-6.00389,address:'Estación de Autobuses Plaza de Armas, Sevilla',dates:'10/18 11:45'},"
          if sevilla_anchor not in s:
              raise SystemExit('Sevilla map anchor not found')
          s = s.replace(sevilla_anchor, sevilla_new, 1)

          granada_anchor = "      {city:'Granada',name:'Granada Railway Station',type:'transport',status:'transport',lat:37.18400,lng:-3.60960,address:'Granada',dates:'10/20 11:04'},"
          granada_new = "      {city:'Granada',name:'Granada Bus Station',type:'transport',status:'transport',lat:37.19953,lng:-3.61359,address:'Estación de Autobuses de Granada, Granada',dates:'10/18 14:45'},\n" + granada_anchor
          if granada_anchor not in s:
              raise SystemExit('Granada map anchor not found')
          s = s.replace(granada_anchor, granada_new, 1)

          p.write_text(s, encoding='utf-8')

      - name: Commit synced itinerary
        run: |
          rm .github/workflows/sync-approved-itinerary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/sync-approved-itinerary.yml
          git commit -m "Sync approved itinerary updates from Notion"
          git push
