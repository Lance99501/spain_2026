name: Add UNESCO crown markers
on:
  push:
    paths:
      - '.github/workflows/add-unesco-crowns.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add UNESCO crown markers to itinerary details
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          css="""\n    .unesco-crown{display:inline-grid;place-items:center;margin-left:5px;vertical-align:.08em;color:#a88745;font-size:.8em;line-height:1;cursor:help;filter:saturate(.85)}\n"""
          anchor="    .timeline{list-style:none;padding:0;margin:0;display:grid;gap:9px}.timeline li{display:grid;grid-template-columns:68px minmax(0,1fr);gap:9px}.timeline time{font:500 .83rem Georgia,serif;color:var(--sage)}.timeline p{margin:0;font-size:.86rem}.timeline em{display:block;font-style:normal;color:var(--muted);font-size:.74rem}\n"
          if '.unesco-crown{' not in s:
              if anchor not in s: raise SystemExit('CSS anchor not found')
              s=s.replace(anchor,anchor+css,1)

          js="""
    const UNESCO_PATTERNS = [
      /聖家堂|Sagrada Fam[ií]lia/i,
      /Park Güell/i,
      /Casa Batll[oó]/i,
      /Casa Mil[aà]/i,
      /Casa Vicens/i,
      /Real Alc[aá]zar de Sevilla/i,
      /Catedral de Sevilla|Giralda/i,
      /Mezquita-Catedral de C[oó]rdoba/i,
      /Puente Romano de C[oó]rdoba/i,
      /Alhambra|Palacios Nazar[ií]es/i,
      /Albaic[ií]n/i,
      /Acueducto de Segovia|Catedral de Segovia|Alc[aá]zar de Segovia/i
    ];
    function markUnesco(root=document){
      root.querySelectorAll('.timeline p').forEach(p=>{
        if(p.querySelector('.unesco-crown')) return;
        const label=(p.childNodes[0]?.textContent||p.textContent||'').trim();
        if(UNESCO_PATTERNS.some(rx=>rx.test(label))){
          const crown=document.createElement('span');
          crown.className='unesco-crown';
          crown.textContent='♛';
          crown.title='UNESCO 世界文化遺產';
          crown.setAttribute('aria-label','UNESCO 世界文化遺產');
          p.insertBefore(crown,p.querySelector('em'));
        }
      });
    }
"""
          marker="    function renderDays(){"
          if 'const UNESCO_PATTERNS' not in s:
              if marker not in s: raise SystemExit('renderDays anchor not found')
              s=s.replace(marker,js+'\n'+marker,1)

          # renderDays rebuilds the itinerary DOM, so mark after every render.
          # Find the function's empty-state update, which occurs at its end.
          old="      empty.hidden=shown!==0;\n    }"
          new="      empty.hidden=shown!==0;\n      markUnesco(days);\n    }"
          if 'markUnesco(days);' not in s:
              if old not in s: raise SystemExit('renderDays end anchor not found')
              s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
      - name: Commit update
        run: |
          rm .github/workflows/add-unesco-crowns.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/add-unesco-crowns.yml
          git commit -m "Mark UNESCO World Heritage itinerary sights"
          git push
